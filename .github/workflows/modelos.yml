name: Listar modelos Gemini
on:
  workflow_dispatch: {}
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Listar nomes dos modelos que geram texto
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print(m['name']) for m in d.get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[])]"
