# ============================================================
#  CONFIGURAÇÃO DO SEU PERFIL — edite à vontade
# ============================================================

perfil:
  nome: "Gabriel Venezaa"       # aparece no cabeçalho estilo tweet
  arroba: "gabrielvenezaa"      # sem o @
  verificado: true              # mostra o selo azul no estilo tweet
  avatar: "assets/avatar.png"   # coloque sua foto aqui (quadrada). Se não existir, usa as iniciais.

conteudo:
  idioma: "português do Brasil"
  nicho: "marketing, vendas, posicionamento e mindset de quem empreende e cria conteúdo"
  tom: "direto, confiante, um pouco provocativo, sem enrolação e sem clichê motivacional barato"
  # Temas que o gerador alterna entre si
  pilares:
    - "posicionamento e comunicação genérica vs. específica"
    - "constância e criação de conteúdo"
    - "vendas e medo de investir em marketing"
    - "mindset, decisão, ação e oportunidades"
    - "gestão, contratação e liderança"
    - "verdades incômodas sobre empreender"
  # Palavras/ideias a evitar
  evitar:
    - "frases genéricas de coach"
    - "hashtags dentro da imagem"
  cta_legenda: "Siga para mais conteúdo sobre marketing e negócios."
  hashtags: ["marketing", "empreendedorismo", "vendas", "marketingdigital", "mindset"]

visual:
  # Rotação dos estilos: papel | branco_vermelho | caixa_alta | escuro_leve | semibold_cinza | regra | tweet_claro | tweet_escuro
  estilos: ["papel", "branco_vermelho", "caixa_alta", "escuro_leve", "tweet_claro", "semibold_cinza", "regra", "tweet_escuro"]
  cor_destaque: "#E5311F"   # vermelho da frase-chave
  largura: 1080
  altura: 1350              # 4:5, o melhor formato do feed

agenda:
  dias: ["seg", "qua", "sex"]
  hora: "09:00"   # horário local (Brasília)

# URL pública das imagens (repositório público do GitHub); usada no agenda.csv
repositorio_url_raw: "https://raw.githubusercontent.com/Venezacode/post-automatico/main"

ia:
  provedor: "gemini"          # "gemini" (camada gratuita, GEMINI_API_KEY) ou "claude" (pago, ANTHROPIC_API_KEY)
  # Tenta na ordem; se um estiver sobrecarregado (503) ou sumir, passa para o próximo
  modelos: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-3.5-flash", "gemini-2.5-flash-lite"]
