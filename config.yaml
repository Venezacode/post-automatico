# ============================================================
#  CONFIGURAÇÃO DO SEU PERFIL — edite à vontade
# ============================================================

perfil:
  nome: "Nohan Ventura"       # aparece no cabeçalho estilo tweet
  arroba: "eu.nohan"      # sem o @
  verificado: true              # mostra o selo azul no estilo tweet
  avatar: "assets/avatar.png"   # coloque sua foto aqui (quadrada). Se não existir, usa as iniciais.

conteudo:
  idioma: "português do Brasil"
  nicho: "frases de mentalidade, filosofia, estoicismo, introspecção, estratégia e história (Marco Aurélio, Sêneca, Epicteto, Dostoiévski, Nietzsche, Sun Tzu, Maquiavel, Musashi, grandes líderes e conquistadores)"
  tom: "sóbrio, grave e introspectivo; poucas palavras, peso de sentença; sem autoajuda barata nem motivação clichê"
  # Temas que o gerador alterna entre si
  pilares:
    - "mentalidade e riqueza: persistência, desejo, fé em si (Napoleon Hill, Pense e Enriqueça)"
    - "estratégia e guerra: conhecer a si e ao adversário, paciência, preparo (Sun Tzu, Musashi, Clausewitz)"
    - "poder, ambição e conquista: líderes e conquistadores (Alexandre, Júlio César, Napoleão, Maquiavel)"
    - "estoicismo: controle, aceitação, obstáculo como caminho (Marco Aurélio, Sêneca, Epicteto)"
    - "introspecção e responsabilidade sobre a própria mente (Dostoiévski, Nietzsche, Jung)"
    - "tempo, disciplina e propósito (Sêneca, Aristóteles, Confúcio)"
  # Palavras/ideias a evitar
  evitar:
    - "frases genéricas de coach"
    - "hashtags dentro da imagem"
    - "citações inventadas ou de autoria duvidosa atribuídas a pessoas reais"
  # false = só citações com autor real; true = permite algumas frases autorais (autor vazio)
  permitir_frases_autorais: false
  cta_legenda: "Siga para mais frases e reflexões."
  hashtags: ["mentalidade", "napoleonhill", "estrategia", "filosofia", "disciplina"]

visual:
  # Rotação dos estilos: papel | branco_vermelho | caixa_alta | escuro_leve | semibold_cinza | regra | tweet_claro | tweet_escuro
  estilos: ["papel", "branco_vermelho", "caixa_alta", "escuro_leve", "tweet_claro", "semibold_cinza", "regra", "tweet_escuro"]
  cor_destaque: "#E5311F"   # vermelho da frase-chave
  largura: 1080
  altura: 1350              # 4:5, o melhor formato do feed

agenda:
  dias: ["seg", "qua", "sex"]
  hora: "09:00"   # horário local (Brasília)

# URL pública das imagens (repositório público do GitHub); usada no agenda.csv
repositorio_url_raw: "https://raw.githubusercontent.com/Venezacode/post-automatico/main"

ia:
  provedor: "gemini"          # "gemini" (camada gratuita, GEMINI_API_KEY) ou "claude" (pago, ANTHROPIC_API_KEY)
  # Tenta na ordem; se um estiver sobrecarregado (503) ou sumir, passa para o próximo
  modelos: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-3.5-flash", "gemini-2.5-flash-lite"]
